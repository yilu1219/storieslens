[variables]
PDF_CRAFT_PYTHON = "/opt/storieslens-py/bin/python"

[phases.setup]
aptPkgs = ["...", "libreoffice-writer", "fonts-noto-cjk", "python3", "python3-pip", "python3-venv", "poppler-utils"]

[phases.install]
cmds = ["npm ci", "python3 -m venv /opt/storieslens-py", "/opt/storieslens-py/bin/pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "npm start"
